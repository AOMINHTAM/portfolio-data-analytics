<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Hiệu ứng đổ bóng phát sáng neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Nền khối vuông bo góc tròn tương tự như icon của anh Tú -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgGrad)" stroke="#2e303d" stroke-width="2.5"/>

  <!-- Ký tự AT thiết kế góc cạnh, đậm nét -->
  <text 
    x="32" 
    y="44" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
    font-size="32" 
    font-weight="900" 
    letter-spacing="-1.5px"
    text-anchor="middle" 
    fill="url(#textGrad)" 
    filter="url(#glow)">AT</text>
</svg>
